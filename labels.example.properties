# arsxml2wv 문구 보완 파일 예시
# 사용법: arsxml2wv.exe <input.xml> <output-dir> labels.properties
#
# - UTF-8로 저장합니다.
# - 왼쪽 숫자는 XML Node의 Id입니다 (Sequence 아님). nodes.tsv / inputs.tsv의 node_id를 보고 작성합니다.
# - 이 파일 값이 PreScript 주석이나 Switch 분기에서 추정한 값보다 우선합니다.
# - 문구에 $ 또는 ; 를 넣으면 화면 규격이 깨지므로 해당 화면이 생성되지 않습니다.
# - '#' 또는 '!'로 시작하는 줄은 주석입니다. 키 이름의 # 는 \# 로 씁니다.

# ---------------------------------------------------------------
# 공통 제목 (TIT) - 모든 화면에 적용. 없으면 첫 MemoNode 이름을 씁니다.
# ---------------------------------------------------------------
title=자동이체 신청

# ---------------------------------------------------------------
# 노드별 설정
#   <Id>.title  : 이 화면만 제목 변경
#   <Id>.text   : 상단 안내 문구 (TXT)
#   <Id>.screen : 화면코드 지정 (SHKC10 / SHKC21 / SHKD12 / SHKE00)
#   <Id>.button.<키> : 버튼 문구 (키: 0-9, *, \#)
# ---------------------------------------------------------------

# 숫자 입력 화면 - 음성 안내("우물정자를 눌러")를 화면용 문구로 변경
14.text=이체 금액을 입력해 주세요.

# 확인 메뉴 - 어미만 남은 추정 문구를 정리
26.text=입력하신 내용이 맞는지 확인해 주세요.
26.button.1=확인
26.button.2=다시 입력

# 완료 메뉴 - 추정 화면코드를 직접 지정하고 버튼 문구 정리
54.screen=SHKE00
54.text=자동이체 신청이 완료되었습니다.
54.button.1=다른 계좌 신청
54.button.9=처음으로
54.button.*=다시 듣기
54.button.\#=이전 단계
